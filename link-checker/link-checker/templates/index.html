<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>فاحص اللينكات</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 16px; }
    input { width: 100%; padding: 12px; font-size: 16px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 12px 24px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; padding: 14px; border-radius: 8px; display: none; }
    .خطير { background: #fdd; }
    .مشبوه { background: #ffe9b3; }
    .غير_معروف { background: #e6e6e6; }
  </style>
</head>
<body>
  <h2>🔍 فاحص اللينكات</h2>
  <input id="url" placeholder="ألصق اللينك هنا، مثال: example.com/login">
  <button id="check-btn">افحص</button>

  <h3>📁 فحص ملف أو صورة</h3>
  <input id="file" type="file">
  <button id="file-btn">افحص الملف</button>

  <p><label><input id="use-vt" type="checkbox" style="width:auto"> افحص كمان في VirusTotal</label></p>
  <div id="result"></div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
